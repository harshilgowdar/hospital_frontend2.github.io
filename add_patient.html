<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Patient</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Add New Patient</h1>
  <form id="patientForm">
    <label for="patientId">Patient ID:</label>
    <input type="text" id="patientId" required>

    <label for="name">Full Name:</label>
    <input type="text" id="name" required>

    <label for="age">Age:</label>
    <input type="number" id="age" min="0" required>

    <label for="gender">Gender:</label>
    <select id="gender" required>
      <option value="">-- Select --</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label for="date">Admission Date:</label>
    <input type="date" id="date" required>

    <button type="submit">Add Patient</button>
  </form>

  <div id="patientConfirmation" style="margin-top: 20px;"></div>

  <script>
    document.getElementById('patientForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('patientId').value;
      const name = document.getElementById('name').value;
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      const date = document.getElementById('date').value;

      const confirmation = document.getElementById('patientConfirmation');
      confirmation.innerHTML = `<strong>Patient Added Successfully!</strong><br>
        ID: ${id}<br>Name: ${name}<br>Age: ${age}<br>Gender: ${gender}<br>Admission Date: ${date}`;

      this.reset(); // clear form
    });
  </script>
</body>
</html>
