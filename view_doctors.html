<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Doctors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Doctors List</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Specialty</th><th>Availability</th>
      </tr>
    </thead>
    <tbody id="doctorTableBody"></tbody>
  </table>

  <script>
    const doctors = [
      { id: 1, name: 'Dr. Asha Mehta', specialty: 'Cardiology', availability: '9am-2pm' },
      { id: 2, name: 'Dr. Rohit Verma', specialty: 'Neurology', availability: '10am-4pm' },
      { id: 3, name: 'Dr. Sneha Rao', specialty: 'Pediatrics', availability: '8am-1pm' },
      { id: 4, name: 'Dr. Arjun Kapoor', specialty: 'Orthopedics', availability: '1pm-6pm' },
      { id: 5, name: 'Dr. Lata Das', specialty: 'Dermatology', availability: '11am-3pm' },
      { id: 6, name: 'Dr. Neeraj Singh', specialty: 'ENT', availability: '9am-12pm' },
    ];

    const tableBody = document.getElementById("doctorTableBody");
    doctors.forEach(doc => {
      const row = `<tr>
        <td>${doc.id}</td><td>${doc.name}</td><td>${doc.specialty}</td><td>${doc.availability}</td>
      </tr>`;
      tableBody.innerHTML += row;
    });
  </script>
</body>
</html>
