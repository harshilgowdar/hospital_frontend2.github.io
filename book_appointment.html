<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Book Appointment</h1>
  <form id="appointmentForm">
    <label for="patientName">Patient Name:</label><br>
    <input type="text" id="patientName" required><br><br>

    <label for="doctor">Select Doctor:</label><br>
    <select id="doctor" required></select><br><br>

    <label for="time">Select Time Slot:</label><br>
    <select id="time" required>
      <option value="">-- Select Time --</option>
      <option>9:00 AM</option>
      <option>10:00 AM</option>
      <option>11:00 AM</option>
      <option>2:00 PM</option>
      <option>3:00 PM</option>
      <option>4:00 PM</option>
    </select><br><br>

    <button type="submit">Book</button>
  </form>

  <div id="confirmation" style="margin-top:20px;"></div>

  <script>
    const doctors = ['Dr. Asha Mehta', 'Dr. Rohit Verma', 'Dr. Sneha Rao', 'Dr. Arjun Kapoor', 'Dr. Lata Das', 'Dr. Neeraj Singh'];
    const doctorSelect = document.getElementById('doctor');
    const confirmation = document.getElementById('confirmation');

    doctors.forEach(doc => {
      const option = document.createElement('option');
      option.text = doc;
      doctorSelect.add(option);
    });

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('patientName').value;
      const doctor = document.getElementById('doctor').value;
      const time = document.getElementById('time').value;

      confirmation.innerHTML = `<strong>Appointment Confirmed:</strong><br>
        Patient: ${name}<br>Doctor: ${doctor}<br>Time: ${time}`;
      this.reset();
    });
  </script>
</body>
</html>
